# The Rust this crate's dispatch and ranking run is generated from the proved
# model in ../formal (Lean) by `cargo lungo build`, and checked in under
# src/generated: a crate that compiles this one needs the `lungo` runtime and
# never Lean. Regenerate after changing the model with
# scripts/generate-formal.sh; TEST12167 fails when the checked-in copy drifts.
project = "../formal"

[build]
root-modules = ["CapDAG.Exec"]
export-modules = ["CapDAG.Exec"]
out-dir = "src/generated"
deny-sorry = true
deny-axioms = true
deny-unsafe = true

# URNs are tagged-urn's: a handle made there passes here without conversion.
[build.extern-types]
"TaggedUrn.Exec.Wf" = "::tagged_urn::FormalUrn"
