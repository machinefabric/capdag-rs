[[bin]]
name = "capdag"
path = "src/bin/capdag.rs"
required-features = ["capture"]

[build-dependencies]
serde_json = "1.0"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
atty = "0.2"
ciborium = "0.2"
crossbeam-channel = "0.5"
dirs = "5.0"
dot-parser = "0.1"
ed25519-dalek = "2"
glob = "0.3"
jsonschema = "0.17"
libc = "0.2"
minisign-verify = "0.2"
pest = "2.8"
pest_derive = "2.8"
regex = "1.0"
serde_json = "1.0"
sha2 = "0.10"
socket2 = "0.6"
thiserror = "1.0"
tracing = "0.1"
urlencoding = "2.1"

[dependencies.ffmpeg-bundle]
optional = true
path = "../ffmpeg-bundle"

[dependencies.image]
default-features = false
features = ["png"]
optional = true
version = "0.25"

[dependencies.ops-rs]
version = "1.63.594"

[dependencies.reqwest]
features = ["json"]
version = "0.12"

[dependencies.serde]
features = ["derive"]
version = "1.0"

[dependencies.tagged-urn]
version = "1.49.155"

[dependencies.tokio]
features = ["full"]
version = "1.0"

[dependencies.uuid]
features = ["v4"]
version = "1.0"

[dev-dependencies]
serial_test = "3.0"
tempfile = "3.10"

[dev-dependencies.tracing-subscriber]
features = ["env-filter"]
version = "0.3"

[features]
capture = ["dep:ffmpeg-bundle", "dep:image"]

[package]
authors = ["https://github.com/machinefabric"]
description = "Core cap URN and definition system for MACHFAB plugins"
edition = "2021"
license = "MIT"
name = "capdag"
version = "1.645.6484"

[target."cfg(windows)".dependencies.windows-sys]
features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"]
version = "0.61"

[[test]]
name = "dev_cartridge_e2e"
required-features = ["capture"]
