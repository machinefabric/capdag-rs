[dependencies]
anyhow = "1.0"
async-trait = "0.1"
ciborium = "0.2"
crossbeam-channel = "0.5"
dirs = "5.0"
dot-parser = "0.1"
# Jitter for the shared retry policy in `llm::net_retry`. Not a general random
# source: it is the one place a backoff needs to not synchronise across
# cartridges that all failed at the same instant.
fastrand = "2"
glob = "0.3"
pest = "2.8"
pest_derive = "2.8"
jsonschema = "0.17"
libc = "0.2"
regex = "1.0"
# float_roundtrip: a number written in a machine is read as the nearest float,
# as every other implementation reads it; without it a number of seventeen or
# more digits can come out one step off.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
# Templates for `llm::structured_queries`, which renders a prompt per query
# from the declarations in queries.json.
tera = "1"
socket2 = "0.6"
thiserror = "1.0"
tracing = "0.1"
urlencoding = "2.1"
uuid = { version = "1.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[dependencies.ops-rs]
version = "1.65.635"

[dependencies.reqwest]
features = ["json"]
version = "0.12"

[dependencies.serde]
features = ["derive"]
version = "1.0"

[dependencies.tagged-urn]
version = "=1.166.24"

# The runtime the code generated from ../formal runs on (see ../lungo.toml). The
# generated code is lungo's of the same version, so the runtime is pinned exactly.
[dependencies.lungo]
version = "=1.120.164"

# The chain from baked roots to a signed manifest, charter or binary. The
# formats and charter rules are MachineFabric's, declared in bifaci::trust.
[dependencies.mg-srel]
version = "0.5"

[dependencies.tokio]
features = ["full"]
version = "1.0"

# Device-capture transport resolution (capture/ module): the vendored
# ffmpeg's avdevice inputs + PNG frame encoding. Optional — only builds
# that resolve DEVICE references (the CLI, the engine, the capture-capable
# cartridges) enable the `capture` feature; everything else stays free of
# the static ffmpeg dist. The synthetic feed needs neither and is always
# built.
[dependencies.ffmpeg-bundle]
git = "https://github.com/jowharshamshiri/ffmpeg-bundle"
# 1.51.0: ffmpeg compiled with the target's C flags, so a sysroot build links
# archives built against the same sysroot.
rev = "229333f58dd7ef7262f3d0c2462828f3c644a7cf"
optional = true

[dependencies.image]
version = "0.25"
default-features = false
features = ["png"]
optional = true

# The command line (cli/ module) and its terminal interface (tui/ module):
# the inline view of a running machine, the pickers, the graph view and the
# machine editor. Optional — only the `capdag` binary enables `cli`; a host
# embedding the library (the engine, a cartridge) never compiles any of it.
[dependencies.clap]
version = "4.5"
features = ["derive", "wrap_help"]
optional = true

[dependencies.strsim]
version = "0.11"
optional = true

[dependencies.ratatui]
version = "0.30"
optional = true

[dependencies.crossterm]
version = "0.29"
features = ["event-stream"]
optional = true

[dependencies.futures-util]
version = "0.3"
optional = true

[dependencies.unicode-width]
version = "0.2"
optional = true

[dependencies.unicode-segmentation]
version = "1"
optional = true

[features]
capture = ["dep:ffmpeg-bundle", "dep:image"]
# The capdag command: a capture-capable host (it resolves device references
# for the machines it runs) with its terminal interface.
cli = [
    "capture",
    "dep:clap",
    "dep:strsim",
    "dep:ratatui",
    "dep:crossterm",
    "dep:futures-util",
    "dep:unicode-width",
    "dep:unicode-segmentation",
    # Previews of what a run produced: an image is drawn in half blocks.
    "dep:image",
    "image/jpeg",
    "image/gif",
    "image/webp",
    "image/bmp",
]

[[bin]]
name = "capdag"
path = "src/bin/capdag.rs"
# Built by the workspace build tool, which passes the feature.
required-features = ["cli"]

[[test]]
name = "dev_cartridge_e2e"
# Exercises the built CLI binary (CARGO_BIN_EXE_capdag), which itself
# requires the cli feature.
required-features = ["cli"]

[[test]]
name = "tui_session"
# Drives the terminal interface end to end on the test cartridge.
required-features = ["cli"]

[dev-dependencies]
# Signing the self-update tests' fixture releases.
ed25519-dalek = "2"
serial_test = "3.0"
tempfile = "3.10"
# A clock the tests move themselves: what a request waits out during an outage
# is checked to the millisecond, without sleeping through it.
tokio = { version = "1.0", features = ["test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# A debug build hashes a bundled cartridge's directory each time it starts
# one, against its build's signed bundle manifest. Unoptimised, SHA-256 runs
# at a few tens of MB/s, which put seconds in front of every debug run; the
# hash is the same bytes either way.
[profile.dev.package.sha2]
opt-level = 3

[package]
authors = ["https://github.com/machinefabric"]
description = "Core capability URN and definition system for CapDAG"
edition = "2021"
license = "MIT"
name = "capdag"
version = "1.1006.269"
